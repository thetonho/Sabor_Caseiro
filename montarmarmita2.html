<!DOCTYPE html>

<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container-fluid px-4">
      <div class="d-flex align-items-center justify-content-between py-2">

        <!-- Logo e Navegação -->
        <div class="d-flex align-items-center gap-4">
          <a href="index.html" class="navbar-brand me-2">
            <img src="./img/logoooo.png" alt="Sabor Caseiro" class="logo-img">
          </a>
          <nav class="d-none d-md-flex gap-4">
            <a href="index.html" class="nav-link-custom">Início</a>
            <a href="montarmarmita.html" class="nav-link-custom">Montar Marmita</a>
          </nav>
        </div>

        <!-- Tema, Carrinho e Autenticação -->
        <div class="d-flex align-items-center gap-3 gap-md-4">
          
          <!-- Botão de Alternar Tema -->
          <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Alternar tema">
            <i class="bi bi-moon-stars-fill"></i>
          </button>

          <!-- Carrinho -->
          <a href="carrinho.html" class="cart-btn" aria-label="Carrinho">
            <i class="bi bi-cart-fill"></i>
            <span class="cart-badge">0</span>

          <a href="login.html" class="nav-link-custom">Entrar</a>
          <a href="cadastro.html" class="nav-link-custom">Cadastrar</a>
        </div>

      </div>
    </div>
  </header>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="container py-5">
  
<h2 class="text-center mb-4">Monte sua marmita</h2>
  <div class="row justify-content-center mb-5 text-center text-secondary fw-semibold">
    <div class="col-auto d-flex align-items-center mb-2">
      <span class="step-icon step-checked">✓</span> <span class="ms-2 text-dark">Tamanho</span>
      <div class="step-line ms-3 d-none d-sm-block"></div>
    </div>
    <div class="col-auto d-flex align-items-center mb-2">
      <span class="step-icon step-active">2</span> <span class="ms-2 text-dark">proteína</span>
      <div class="step-line ms-3 d-none d-sm-block"></div>
    </div>
    <div class="col-auto d-flex align-items-center mb-2">
      <span class="step-icon step-inactive">3</span> <span class="ms-2">Carboidrato</span>
      <div class="step-line ms-3 d-none d-sm-block"></div>
    </div>
    <div class="col-auto d-flex align-items-center mb-2">
      <span class="step-icon step-inactive">4</span> <span class="ms-2">Acompanhamento</span>
    </div>
  </div>

  <h3 class="fw-bold mb-4 ms-2 text-dark">Escolha a proteína:</h3>

  <div class="row g-4 px-2">
    
    <!-- Proteina 1 -->
    <div class="col-12 col-md-6 col-lg-4">
      <button type="button" class="btn btn-marmita-proteina w-100 d-flex align-items-center p-3 text-start">
        <div class="img-container me-3 bg-light overflow-hidden">
          <img src="caminho_da_sua_imagem/frango.jpg" alt="Frango Empanado">
        </div>
        <div class="text-white overflow-hidden">
          <strong class="d-block fs-5 mb-1 text-truncate">Frango Empanado</strong>
          <span class="d-block small text-light text-truncate opacity-75">peito de frango empanado temperado e...</span>
        </div>
      </button>
    </div>

    <!-- Proteina 2 -->
    <div class="col-12 col-md-6 col-lg-4">
      <button type="button" class="btn btn-marmita-proteina w-100 d-flex align-items-center p-3 text-start">
        <div class="img-container me-3 bg-light overflow-hidden">
          <img src="caminho_da_sua_imagem/carne.jpg" alt="Carne de Panela">
        </div>
        <div class="text-white overflow-hidden">
          <strong class="d-block fs-5 mb-1 text-truncate">Carne de Panela</strong>
          <span class="d-block small text-light text-truncate opacity-75">carne bovina cozida lentamene na...</span>
        </div>
      </button>
    </div>

    <!-- Proteina 3 -->
    <div class="col-12 col-md-6 col-lg-4">
      <button type="button" class="btn btn-marmita-proteina w-100 d-flex align-items-center p-3 text-start">
        <div class="img-container me-3 bg-light overflow-hidden">
          <img src="caminho_da_sua_imagem/peixe.jpg" alt="Peixe Grelhado">
        </div>
        <div class="text-white overflow-hidden">
          <strong class="d-block fs-5 mb-1 text-truncate">Peixe Grelhado</strong>
          <span class="d-block small text-light text-truncate opacity-75">filé de tilápia grelhado temperado com...</span>
        </div>
      </button>
    </div>

    <!-- Proteina 4 -->
    <div class="col-12 col-md-6 col-lg-4">
      <button type="button" class="btn btn-marmita-proteina w-100 d-flex align-items-center p-3 text-start">
        <div class="img-container me-3 bg-light overflow-hidden">
          <img src="caminho_da_sua_imagem/ovo.jpg" alt="Ovo Cozido">
        </div>
        <div class="text-white overflow-hidden">
          <strong class="d-block fs-5 mb-1 text-truncate">Ovo Cozido</strong>
          <span class="d-block small text-light text-truncate opacity-75">ovos caipiras cozidos na água quente...</span>
        </div>
      </button>
    </div>

    <!-- Proteina 5 -->
    <div class="col-12 col-md-6 col-lg-4">
      <button type="button" class="btn btn-marmita-proteina w-100 d-flex align-items-center p-3 text-start">
        <div class="img-container me-3 bg-light overflow-hidden">
          <img src="caminho_da_sua_imagem/strogonoff.jpg" alt="Strogonoff de Frango">
        </div>
        <div class="text-white overflow-hidden">
          <strong class="d-block fs-5 mb-1 text-truncate">Strogonoff de Frango</strong>
          <span class="d-block small text-light text-truncate opacity-75">clássico strogonoff cremoso temper...</span>
        </div>
      </button>
    </div>

  </div>
</main>

</div>
