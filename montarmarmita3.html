<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sabor Caseiro - Montar Marmita</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container-fluid px-4">
      <div class="d-flex align-items-center justify-content-between py-2">

        <!-- Logo e Navegação -->
        <div class="d-flex align-items-center gap-4">
          <a href="index.html" class="navbar-brand me-2">
            <img src="./img/logoooo.png" alt="Sabor Caseiro" class="logo-img">
          </a>
          <nav class="d-none d-md-flex gap-4">
            <a href="index.html" class="nav-link-custom">Início</a>
            <a href="montarmarmita.html" class="nav-link-custom">Montar Marmita</a>
          </nav>
        </div>

        <!-- Tema, Carrinho e Autenticação -->
        <div class="d-flex align-items-center gap-3 gap-md-4">
          
          <!-- Botão de Alternar Tema -->
          <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Alternar tema">
            <i class="bi bi-moon-stars-fill"></i>
          </button>

          <!-- Carrinho -->
          <a href="carrinho.html" class="cart-btn" aria-label="Carrinho">
            <i class="bi bi-cart-fill"></i>
            <span class="cart-badge">0</span>
          </a>

          <a href="login.html" class="nav-link-custom">Entrar</a>
          <a href="cadastro.html" class="nav-link-custom">Cadastrar</a>
        </div>

      </div>
    </div>
  </header>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="container py-5">
  
  
  <h2 class="text-center mb-4">Monte sua marmita</h2>

  
  <div class="row justify-content-center mb-5 text-center text-secondary fw-semibold">
    <div class="col-auto d-flex align-items-center mb-2">
      <span class="step-icon step-checked">✓</span> <span class="ms-2 text-dark">Tamanho</span>
      <div class="step-line ms-3 d-none d-sm-block"></div>
    </div>
    <div class="col-auto d-flex align-items-center mb-2">
      <span class="step-icon step-checked">✓</span> <span class="ms-2 text-dark">proteína</span>
      <div class="step-line ms-3 d-none d-sm-block"></div>
    </div>
    <div class="col-auto d-flex align-items-center mb-2">
      <span class="step-icon step-active">3</span> <span class="ms-2 text-dark">Carboidrato</span>
      <div class="step-line ms-3 d-none d-sm-block"></div>
    </div>
    <div class="col-auto d-flex align-items-center mb-2">
      <span class="step-icon step-inactive">4</span> <span class="ms-2">Acompanhamento</span>
    </div>
  </div>

 
  <h3 class="fw-bold mb-4 ms-2 text-dark">Escolha os Carboidratos:</h3>

 
  <div class="row g-4 px-2 mb-5">
    
    <!-- Carboidrato 1 -->
    <div class="col-12 col-md-6 col-lg-4">
      <button type="button" class="btn btn-marmita-proteina w-100 d-flex align-items-center p-3 text-start">
        <div class="img-container me-3 bg-light overflow-hidden">
          <img src="./img/arroz-branco.svg" alt="Arroz Branco">
        </div>
        <div class="text-white overflow-hidden">
          <strong class="d-block fs-5 mb-1 text-truncate">Arroz Branco</strong>
          <span class="d-block small text-light text-truncate opacity-75">100 gramas de arroz branco</span>
        </div>
      </button>
    </div>

    <!-- Carboidrato 2 -->
    <div class="col-12 col-md-6 col-lg-4">
      <button type="button" class="btn btn-marmita-proteina w-100 d-flex align-items-center p-3 text-start">
        <div class="img-container me-3 bg-light overflow-hidden">
          <img src="./img/arroz-integral.svg" alt="Arroz Integral">
        </div>
        <div class="text-white overflow-hidden">
          <strong class="d-block fs-5 mb-1 text-truncate">Arroz Integral</strong>
          <span class="d-block small text-light text-truncate opacity-75">100 gramas de arroz integral</span>
        </div>
      </button>
    </div>

    <!-- Carboidrato 3 -->
    <div class="col-12 col-md-6 col-lg-4">
      <button type="button" class="btn btn-marmita-proteina w-100 d-flex align-items-center p-3 text-start">
        <div class="img-container me-3 bg-light overflow-hidden">
          <img src="./img/feijao-carioca.svg" alt="Feijão Carioca">
        </div>
        <div class="text-white overflow-hidden">
          <strong class="d-block fs-5 mb-1 text-truncate">Feijão Carioca</strong>
          <span class="d-block small text-light text-truncate opacity-75">100 gramas de feijão carioca</span>
        </div>
      </button>
    </div>

    <!-- Carboidrato 4 -->
    <div class="col-12 col-md-6 col-lg-4">
      <button type="button" class="btn btn-marmita-proteina w-100 d-flex align-items-center p-3 text-start">
        <div class="img-container me-3 bg-light overflow-hidden">
          <img src="./img/feijao-preto.svg" alt="Feijão Preto">
        </div>
        <div class="text-white overflow-hidden">
          <strong class="d-block fs-5 mb-1 text-truncate">Feijão Preto</strong>
          <span class="d-block small text-light text-truncate opacity-75">100 gramas de feijão preto</span>
        </div>
      </button>
    </div>

    <!-- Carboidrato 5-->
    <div class="col-12 col-md-6 col-lg-4">
      <button type="button" class="btn btn-marmita-proteina w-100 d-flex align-items-center p-3 text-start">
        <div class="img-container me-3 bg-light overflow-hidden">
          <img src="./img/macarrao.svg" alt="Macarrão">
        </div>
        <div class="text-white overflow-hidden">
          <strong class="d-block fs-5 mb-1 text-truncate">Macarrão</strong>
          <span class="d-block small text-light text-truncate opacity-75">100 gramas de macarrão</span>
        </div>
      </button>
    </div>

  </div>

      <!-- RESUMO DO PEDIDO -->
   <div class="marmita-summary">
  <div class="summary-total">
    <span>Valor total</span>
    <strong>R$ 0,00</strong>
  </div>
      <div class="col-12 col-sm-auto d-flex gap-3">
      <a href="montarmarmita2.html" class="next-link">
        <button type="button" class="btn-next-marmita">
          <i class="bi bi-arrow-left"></i> Voltar
        </button>
      </a>
  <a href="montarmarmita4.html" class="next-link">
    <button type="button" class="btn-next-marmita">
      Próximo <i class="bi bi-arrow-right"></i>
    </button>
  </a>
</div>
</div>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <!-- JavaScript Customizado -->
  <script src="script.js"></script>

</body>
</html>
