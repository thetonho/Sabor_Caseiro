<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor Caseiro - Criar conta</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos Customizados -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container-fluid px-4">
      <div class="d-flex align-items-center justify-content-between py-2">

        <!-- Logo e Navegação -->
        <div class="d-flex align-items-center gap-4">
          <a href="index.html" class="navbar-brand me-2">
            <img src="./img/logoooo.png" alt="Sabor Caseiro" class="logo-img">
          </a>
          <nav class="d-none d-md-flex gap-4">
            <a href="index.html" class="nav-link-custom">Início</a>
            <a href="#" class="nav-link-custom">Montar Marmita</a>
          </nav>
        </div>

        <!-- Carrinho e Autenticação -->
        <div class="d-flex align-items-center gap-4">
          <button class="cart-btn" type="button" aria-label="Carrinho">
            <i class="bi bi-cart-fill"></i>
            <span class="cart-badge">0</span>
          </button>
          <a href="#" class="nav-link-custom">Entrar</a>
          <a href="cadastro.html" class="nav-link-custom">Cadastrar</a>
        </div>

      </div>
    </div>
  </header>

  <!-- ===== CONTEÚDO: FORMULÁRIO CENTRALIZADO ===== -->
  <main class="signup-wrap d-flex align-items-center justify-content-center py-5">
    <div class="signup-form-inner">
      
      <!-- Cabeçalho do Card (Logo e Texto coladinhos) -->
      <div class="d-flex align-items-center justify-content-center gap-1 mb-3">
        <img src="./img/logoooo.png" alt="Sabor Caseiro" class="logo-img-card">
        <span class="brand-name fs-5">Sabor Caseiro</span>
      </div>

      <div class="text-center mb-4">
        <h2 class="signup-title">Crie sua conta</h2>
        <p class="signup-subtitle m-0">Preencha os dados abaixo para começar</p>
      </div>

      <!-- Formulário -->
      <form>
        <div class="mb-3">
          <label for="nome" class="form-label-custom">Nome Completo</label>
          <input type="text" class="form-control form-control-custom" id="nome" placeholder="Seu nome" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label-custom">Email</label>
          <input type="email" class="form-control form-control-custom" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-12 col-sm-6">
            <label for="senha" class="form-label-custom">Senha</label>
            <div class="password-wrap">
              <input type="password" class="form-control form-control-custom" id="senha" placeholder="••••••••" required>
              <i class="bi bi-eye-slash password-toggle"></i>
            </div>
          </div>
          <div class="col-12 col-sm-6">
            <label for="confirmarSenha" class="form-label-custom">Confirmar Senha</label>
            <div class="password-wrap">
              <input type="password" class="form-control form-control-custom" id="confirmarSenha" placeholder="••••••••" required>
              <i class="bi bi-eye-slash password-toggle"></i>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="telefone" class="form-label-custom">Telefone</label>
          <input type="tel" class="form-control form-control-custom" id="telefone" placeholder="(16) 98765-4321">
        </div>

        <div class="mb-4">
          <label for="endereco" class="form-label-custom">Endereço</label>
          <input type="text" class="form-control form-control-custom" id="endereco" placeholder="Rua, número, bairro">
        </div>

        <button type="submit" class="btn btn-cta w-100">Criar conta</button>
        <p class="login-link">Já tem uma conta? <a href="#">Faça login</a></p>
      </form>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
