<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sabor Caseiro - Montar Marmita</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Estilos Customizados -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container-fluid px-4">
      <div class="d-flex align-items-center justify-content-between py-2">

        <!-- Logo e Navegação -->
        <div class="d-flex align-items-center gap-4">

          <a href="index.html" class="navbar-brand me-2">
            <img
              src="./img/logoooo.png"
              alt="Sabor Caseiro"
              class="logo-img"
            >
          </a>

          <nav class="d-none d-md-flex gap-4">
            <a href="index.html" class="nav-link-custom">
              Início
            </a>

            <a href="montarmarmita.html" class="nav-link-custom">
              Montar Marmita
            </a>
          </nav>

        </div>

        <!-- Carrinho e Autenticação -->
        <div class="d-flex align-items-center gap-4">

          <button
            class="cart-btn"
            type="button"
            aria-label="Carrinho"
          >
            <i class="bi bi-cart-fill"></i>
            <span class="cart-badge">0</span>
          </button>

          <a href="login.html" class="nav-link-custom">
            Entrar
          </a>

          <a href="cadastro.html" class="nav-link-custom">
            Cadastrar
          </a>

        </div>

      </div>
    </div>
  </header>


  <div class="container py-5">

  <h2 class="text-center mb-4">Monte sua marmita</h2>

  <div class="row justify-content-center g-4">

    <!-- Marmitex P -->
    <div class="col-12 col-md-4">
      <button type="button" class="btn btn-marmita w-100">
        <strong>Marmitex P</strong>
        <span>500 ml</span>
        <span>R$ 18,00</span>
      </button>
    </div>

    <!-- Marmitex M -->
    <div class="col-12 col-md-4">
      <button type="button" class="btn btn-marmita w-100">
        <strong>Marmitex M</strong>
        <span>700 ml</span>
        <span>R$ 22,00</span>
      </button>
    </div>

    <!-- Marmitex G -->
    <div class="col-12 col-md-4">
      <button type="button" class="btn btn-marmita w-100">
        <strong>Marmitex G</strong>
        <span>1000 ml</span>
        <span>R$ 27,00</span>
      </button>
    </div>

  </div>

</div>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
