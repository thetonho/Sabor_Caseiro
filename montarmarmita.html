<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sabor Caseiro - Montar Marmita</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container-fluid px-4">
      <div class="d-flex align-items-center justify-content-between py-2">

        <!-- Logo e Navegação -->
        <div class="d-flex align-items-center gap-4">
          <a href="index.html" class="navbar-brand me-2">
            <img src="./img/logoooo.png" alt="Sabor Caseiro" class="logo-img">
          </a>
          <nav class="d-none d-md-flex gap-4">
            <a href="index.html" class="nav-link-custom">Início</a>
            <a href="montarmarmita.html" class="nav-link-custom">Montar Marmita</a>
          </nav>
        </div>

        <!-- Tema, Carrinho e Autenticação -->
        <div class="d-flex align-items-center gap-3 gap-md-4">
          
          <!-- Botão de Alternar Tema -->
          <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Alternar tema">
            <i class="bi bi-moon-stars-fill"></i>
          </button>

          <!-- Carrinho -->
          <a href="carrinho.html" class="cart-btn" aria-label="Carrinho">
            <i class="bi bi-cart-fill"></i>
            <span class="cart-badge">0</span>
          </a>

          <a href="login.html" class="nav-link-custom">Entrar</a>
          <a href="cadastro.html" class="nav-link-custom">Cadastrar</a>
        </div>

      </div>
    </div>
  </header>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="container py-5">
    
    <h2 class="text-center mb-4">Monte sua marmita</h2>
    <h3 class="marmita-section-title mb-4">Escolha o tamanho da sua marmita:</h3>

    <div class="row justify-content-center g-4">

      <!-- Marmitex P -->
      <div class="col-12 col-md-4">
        <button type="button" class="btn btn-marmita w-100">
          <strong>Marmitex P - 500Ml</strong>
          <strong>R$ 18,00</strong>
          <span>• 1 carboidrato</span>
          <span>• 1 proteína</span>
          <span>• 1 acompanhamento</span>
        </button>
      </div>

      <!-- Marmitex M -->
      <div class="col-12 col-md-4">
        <button type="button" class="btn btn-marmita w-100">
          <strong>Marmitex M - 760Ml</strong>
          <strong>R$ 22,00</strong>
          <span>• 2 carboidratos</span>
          <span>• 2 proteínas</span>
          <span>• 2 acompanhamentos</span>
        </button>
      </div>

      <!-- Marmitex G -->
      <div class="col-12 col-md-4">
        <button type="button" class="btn btn-marmita w-100">
          <strong>Marmitex G - 1100Ml</strong>
          <strong>R$ 24,00</strong>
          <span>• 3 carboidratos</span>
          <span>• 2 proteínas</span>
          <span>• 2 acompanhamentos</span>
        </button>
      </div>

    </div>

    <!-- RESUMO DO PEDIDO -->
    <div class="marmita-summary">
      <div class="summary-total">
        <span>Valor total</span>
        <strong>R$ 0,00</strong>
      </div>

      <button type="button" class="btn-next-marmita">
        Próximo
        <i class="bi bi-arrow-right"></i>
      </button>
    </div>

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <!-- JavaScript Customizado -->
  <script src="script.js"></script>

</body>
</html>
