<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor Caseiro - Entrar</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos Customizados -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container-fluid px-4">
      <div class="d-flex align-items-center justify-content-between py-2">

        <!-- Logo e Navegação -->
        <div class="d-flex align-items-center gap-4">
          <a href="index.html" class="navbar-brand me-2">
            <img src="./img/logoooo.png" alt="Sabor Caseiro" class="logo-img">
          </a>
          <nav class="d-none d-md-flex gap-4">
            <a href="index.html" class="nav-link-custom">Início</a>
            <a href="montarmarmita.html" class="nav-link-custom">Montar Marmita</a>
          </nav>
        </div>

        <!-- Tema, Carrinho e Autenticação -->
        <div class="d-flex align-items-center gap-3 gap-md-4">
          
          <!-- Botão de Alternar Tema -->
          <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Alternar tema">
            <i class="bi bi-moon-stars-fill"></i>
          </button>

          <!-- Carrinho -->
          <a href="carrinho.html" class="cart-btn" aria-label="Carrinho">
            <i class="bi bi-cart-fill"></i>
            <span class="cart-badge">0</span>
          </a>

          <a href="login.html" class="nav-link-custom">Entrar</a>
          <a href="cadastro.html" class="nav-link-custom">Cadastrar</a>
        </div>

      </div>
    </div>
  </header>

  <!-- ===== CONTEÚDO: FORMULÁRIO DE LOGIN CENTRALIZADO ===== -->
  <main class="signup-wrap d-flex align-items-center justify-content-center py-5">
    <div class="signup-form-inner">
      
      <!-- Cabeçalho do Card -->
      <div class="d-flex align-items-center justify-content-center gap-2 mb-3">
        <img src="./img/logoooo.png" alt="Sabor Caseiro" class="logo-img-card">
        <span class="brand-name fs-5">Sabor Caseiro</span>
      </div>

      <div class="text-center mb-4">
        <h2 class="signup-title">Acesse sua conta</h2>
        <p class="signup-subtitle m-0">Bem-vindo de volta! Digite seus dados para entrar.</p>
      </div>

      <!-- Formulário de Login -->
      <form>
        <div class="mb-3">
          <label for="email" class="form-label-custom">Email</label>
          <input type="email" class="form-control form-control-custom" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="senha" class="form-label-custom mb-0">Senha</label>
            <a href="#" class="login-link text-decoration-none m-0" style="font-size: 0.8rem;">Esqueceu a senha?</a>
          </div>
          <div class="password-wrap">
            <input type="password" class="form-control form-control-custom" id="senha" placeholder="••••••••" required>
            <i class="bi bi-eye-slash password-toggle"></i>
          </div>
        </div>

        <button type="submit" class="btn btn-cta w-100 mt-3">Entrar</button>
        <p class="login-link mt-3">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
      </form>

    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <!-- JavaScript Customizado -->
  <script src="script.js"></script>
</body>
</html>
